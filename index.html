<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/personal-information.png" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="theme-color" content="#101319" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
        <title>Ayan's Portfolio</title>
        <!-- Apply the saved theme before the first paint (same key and default
             as ThemeContext: dark unless "light" was chosen), so light-theme
             visitors never see a flash of the dark palette. -->
        <script>
            try {
                if (localStorage.getItem("theme") !== "light")
                    document.documentElement.classList.add("dark");
            } catch {
                document.documentElement.classList.add("dark");
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
