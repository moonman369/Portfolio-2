<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- The moon favicon set (scripts/render-favicons.py). -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
        <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="theme-color" content="#101319" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
        <title>Ayan's Portfolio</title>
        <!-- Apply the saved theme before the first paint (same key and default
             as ThemeContext: dark unless "light" was chosen), so light-theme
             visitors never see a flash of the dark palette. -->
        <script>
            try {
                if (localStorage.getItem("theme") !== "light")
                    document.documentElement.classList.add("dark");
            } catch {
                document.documentElement.classList.add("dark");
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
