<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The site's moon: a waxing gibbous with a faint earthshine night side
       and a thin accent rim, so it reads on light and dark tabs (matches the
       PNGs from scripts/render-favicons.py). -->
  <defs>
    <radialGradient id="lit" cx="0.62" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f2efe7"/>
      <stop offset="0.6" stop-color="#cfccc4"/>
      <stop offset="1" stop-color="#a7a49d"/>
    </radialGradient>
    <clipPath id="day">
      <path d="M32 3A29 29 0 0 1 32 61A6.960 29 0 0 1 32 3Z"/>
    </clipPath>
  </defs>
  <circle cx="32" cy="32" r="29" fill="#1a1f29"/>
  <path d="M32 3A29 29 0 0 1 32 61A6.960 29 0 0 1 32 3Z" fill="url(#lit)"/>
  <!-- Maria, near side: Imbrium, Serenitatis, Tranquillitatis, Crisium,
       Fecunditatis, Nubium, Procellarum. -->
  <g clip-path="url(#day)" fill="#6f6d69" fill-opacity="0.55">
    <ellipse cx="24" cy="21" rx="8" ry="6.5"/>
    <ellipse cx="37" cy="21" rx="5" ry="4.5"/>
    <ellipse cx="41" cy="30" rx="6" ry="5"/>
    <ellipse cx="52" cy="24" rx="3.2" ry="3.6"/>
    <ellipse cx="49" cy="38" rx="4" ry="4.5"/>
    <ellipse cx="28" cy="43" rx="5" ry="4"/>
    <ellipse cx="14" cy="32" rx="8" ry="13"/>
  </g>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#85ceff" stroke-opacity="0.6" stroke-width="2.2"/>
</svg>
